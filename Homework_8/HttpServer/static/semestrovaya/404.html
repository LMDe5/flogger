<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Страница не найдена. Вернитесь в базу знаний «Тайный Грааль».">
  <title>404 — Страница не найдена</title>
  <link rel="stylesheet" href="semestrovaya/style.css">
  <style>
    .error-page { position: relative; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; overflow: hidden; isolation: isolate; padding: 35px 18px; background: radial-gradient(ellipse at 50% 48%, rgba(74, 72, 79, .18), transparent 29rem), radial-gradient(ellipse at 50% 100%, rgba(51, 60, 67, .19), transparent 32rem), var(--bg); }
    .error-page::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .38; background-image: radial-gradient(1px 1px at 16% 19%, rgba(226, 197, 140, .7) 50%, transparent 100%), radial-gradient(1px 1px at 78% 12%, rgba(226, 197, 140, .55) 50%, transparent 100%), radial-gradient(1px 1px at 84% 61%, rgba(226, 197, 140, .55) 50%, transparent 100%), radial-gradient(1px 1px at 24% 74%, rgba(226, 197, 140, .55) 50%, transparent 100%), radial-gradient(1px 1px at 62% 88%, rgba(226, 197, 140, .45) 50%, transparent 100%); }
    .error-scene { position: relative; width: min(100%, 760px); display: grid; justify-items: center; text-align: center; }
    .error-brand { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .error-brand .brand__seal { width: 48px; height: 48px; font-size: 19px; }
    .error-brand .brand__text { align-items: center; }
    .error-brand .brand__text small { color: #8b8272; letter-spacing: .22em; }
    .error-moon { position: absolute; z-index: -1; top: 85px; left: 50%; width: clamp(190px, 37vw, 300px); aspect-ratio: 1; border: 1px solid rgba(226, 218, 195, .28); border-radius: 50%; transform: translateX(-50%); background: radial-gradient(circle at 34% 28%, rgba(250, 246, 228, .22), rgba(119, 118, 124, .12) 48%, rgba(34, 34, 40, .05) 72%); box-shadow: inset -24px -12px 60px rgba(0, 0, 0, .35), 0 0 72px rgba(201, 167, 109, .08); }
    .error-moon::before, .error-moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(12, 12, 16, .15); box-shadow: inset 2px 3px 7px rgba(0, 0, 0, .22); }
    .error-moon::before { top: 24%; left: 22%; width: 18%; height: 13%; transform: rotate(-19deg); }
    .error-moon::after { right: 21%; bottom: 26%; width: 23%; height: 16%; transform: rotate(16deg); }
    .error-fog { position: absolute; z-index: -1; top: 230px; left: 50%; width: min(115vw, 860px); height: 140px; transform: translateX(-50%); border-radius: 50%; background: rgba(136, 140, 144, .09); filter: blur(36px); }
    .error-code { margin: 18px 0 -4px; color: rgba(238, 233, 223, .92); font-family: var(--serif); font-size: clamp(130px, 25vw, 230px); font-weight: 400; letter-spacing: -.09em; line-height: .92; text-shadow: 0 10px 38px rgba(0, 0, 0, .62), 0 0 26px rgba(226, 197, 140, .11); }
    .error-title { margin: 9px 0 0; color: var(--gold-light); font-family: var(--serif); font-size: clamp(24px, 4vw, 36px); font-weight: 400; }
    .error-copy { max-width: 420px; margin: 10px 0 24px; color: #aaa69e; font-size: 13px; line-height: 1.8; }
    .error-page .button { min-height: 44px; padding-inline: 22px; }
    @media (max-width: 520px) {
      .error-page { padding: 24px 16px; }
      .error-moon { top: 92px; }
      .error-code { font-size: 138px; margin-top: 32px; }
      .error-copy { max-width: 300px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="error-page">
    <section class="error-scene" aria-labelledby="error-title">
      <div class="error-moon" aria-hidden="true"></div>
      <div class="error-fog" aria-hidden="true"></div>
      <a class="brand error-brand" href="/" aria-label="Тайный Грааль — база знаний">
        <span class="brand__seal" aria-hidden="true">✦</span>
        <span class="brand__text"><strong>Тайный Грааль</strong><small>БАЗА ЗНАНИЙ</small></span>
      </a>
      <p class="error-code" aria-hidden="true">404</p>
      <h1 class="error-title" id="error-title">Страница не найдена</h1>
      <p class="error-copy">Похоже, эта тропа ведёт в туман. Вернитесь в архив — там история продолжается.</p>
      <a class="button button--primary" href="/">Вернуться на главную <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
