<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
			<title>Игроки</title>
	</head>
	<body>
		<h1>Список игроков</h1>
		<table border="1" cellpadding="6" cellspacing="0">
			<tr>
				<th>Id</th>
				<th>Name</th>
				<th>Level</th>
			</tr>
			$foreach (var p in Players)
			<tr>
				<td>${Id}</td>
				<td>${Name}</td>
				<td>${Level}</td>
			</tr>
			$endfor
		</table>
	</body>
</html>
