<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Создание и редактирование карточек вики «Тайный Грааль».">
  <title>Редактор карточки — Панель управления</title>
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.6/quill.snow.css">
  <link rel="stylesheet" href="/semestrovaya/styles.css">
  <script src="https://cdn.quilljs.com/1.3.6/quill.js" defer></script>
  <style>
    .editor-heading { margin: 0 0 24px; }
    .editor-heading .eyebrow { margin-bottom: 9px; }
    .editor-heading h1 { margin: 0; color: var(--text); font-family: var(--serif); font-size: clamp(35px, 4.4vw, 50px); font-weight: 400; letter-spacing: -.04em; line-height: 1.12; }
    .editor-heading h1 span { color: var(--gold-light); }
    .form-panel { max-width: 930px; padding: clamp(19px, 3vw, 31px); border: 1px solid rgba(201, 167, 109, .2); background: radial-gradient(ellipse at 100% 0, rgba(201, 167, 109, .055), transparent 38%), linear-gradient(145deg, rgba(20, 20, 26, .97), rgba(13, 13, 17, .98)); box-shadow: 0 18px 45px rgba(0, 0, 0, .23); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 21px 20px; }
    .field { min-width: 0; }
    .field--full { grid-column: 1 / -1; }
    .field__label { display: block; margin-bottom: 8px; color: #d7d0c3; font-family: var(--serif); font-size: 15px; }
    .required-mark { color: var(--gold-light); }
    .field__control { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid rgba(201, 167, 109, .22); border-radius: 0; color: var(--text); background: #101015; font-size: 12px; }
    .field__control:focus { border-color: rgba(201, 167, 109, .72); outline: none; box-shadow: 0 0 0 3px rgba(201, 167, 109, .08); }
    select.field__control { appearance: none; padding-right: 38px; background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%); background-position: calc(100% - 17px) 19px, calc(100% - 12px) 19px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    select.field__control option { color: var(--text); background: #111116; }
    #editor { min-height: 190px; border: 1px solid rgba(201, 167, 109, .3); background: #101015; }
    .ql-toolbar.ql-snow { border: 1px solid rgba(201, 167, 109, .3); background: #17171d; }
    .ql-container.ql-snow { border: 1px solid rgba(201, 167, 109, .3); border-top: 0; color: var(--text); font-family: Arial, sans-serif; font-size: 13px; }
    .ql-snow .ql-stroke { stroke: #cdb579 !important; }
    .ql-snow .ql-fill { fill: #cdb579 !important; }
    .ql-snow .ql-picker, .ql-snow .ql-picker-label, .ql-snow .ql-picker-item { color: #d8cfbd !important; }
    .ql-snow .ql-picker-options, .ql-snow .ql-tooltip { border: 1px solid rgba(201, 167, 109, .36) !important; color: var(--text); background: #17171d !important; }
    .ql-snow .ql-tooltip input[type="text"] { color: var(--text); background: #0d0d11; }
    .ql-snow .ql-editor { min-height: 190px; color: #e8e3d9; line-height: 1.7; }
    .ql-snow .ql-editor.ql-blank::before { color: #77736d; }
    .ql-snow .ql-editor a, .ql-snow .ql-tooltip a { color: var(--gold-light) !important; }
    .description-meta { display: flex; justify-content: flex-end; margin-top: 7px; color: #858078; font-size: 10px; }
    .is-over-limit { color: #e29296; }
    .file-input::file-selector-button { margin-right: 12px; padding: 8px 12px; border: 1px solid rgba(201, 167, 109, .4); color: var(--gold-light); background: #17171d; cursor: pointer; }
    .file-hint { display: block; margin-top: 6px; color: #a69c87; font-size: 11px; }
    .image-preview { display: block; max-width: min(220px, 100%); max-height: 280px; margin-top: 10px; border: 1px solid rgba(201, 167, 109, .35); background: #101015; }
    .image-preview[hidden], .notice[hidden] { display: none; }
    .notice { margin-top: 20px; padding: 12px 14px; border: 1px solid; font-size: 12px; }
    .notice--error { border-color: rgba(197, 88, 96, .55); color: #e8adb0; background: rgba(112, 32, 39, .19); }
    .form-actions { display: flex; justify-content: flex-end; gap: 11px; margin-top: 24px; padding-top: 19px; border-top: 1px solid rgba(201, 167, 109, .13); }
    .form-actions .button { min-width: 116px; min-height: 43px; font-size: 10px; letter-spacing: .1em; }
    .form-actions .button:disabled { opacity: .65; cursor: wait; }
    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; gap: 17px; }
      .form-actions { flex-direction: column-reverse; }
      .form-actions .button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="brand" href="/" aria-label="Тайный Грааль — панель управления">
        <span class="brand__seal" aria-hidden="true">✦</span>
        <span class="brand__text"><strong>Тайный Грааль</strong><small>ПАНЕЛЬ УПРАВЛЕНИЯ</small></span>
      </a>
      <p class="admin-sidebar__label">Управление</p>
      <nav class="admin-nav" aria-label="Разделы панели управления">
        <a class="admin-nav__link" href="/admin"><span class="admin-nav__icon" aria-hidden="true">⌂</span><span>Дашборд</span></a>
        <a class="admin-nav__link is-active" href="/admin/cards" aria-current="page"><span class="admin-nav__icon" aria-hidden="true">✧</span><span>Карточки</span></a>
      </nav>
      <div class="admin-sidebar__grow"></div>
    </aside>

    <main class="admin-main">
      <div class="admin-breadcrumb">Панель управления <span>/</span> Редактор карточки</div>
      <section class="editor-heading" aria-labelledby="editor-title">
        <p class="eyebrow">АРХИВ ИГРЫ</p>
        <h1 id="editor-title">Редактор <span>карточки</span></h1>
      </section>

      <section class="form-panel" aria-label="Форма карточки">
        <form id="card-form" method="post">
          <input type="hidden" id="card-id" name="CardId" value="${CardId}">
          <input type="hidden" id="description-field" name="CardDescription">
          <div class="form-grid">
            <div class="field">
              <label class="field__label" for="card-name">Название <span class="required-mark">*</span></label>
              <input class="field__control" type="text" id="card-name" name="CardName" value="${CardName}" autocomplete="off" required>
            </div>
            <div class="field">
              <label class="field__label" for="card-type">Тип</label>
              <select class="field__control" id="card-type" name="CardType" data-selected="${CardType}">
                <option value="Персонаж">Персонаж</option>
                <option value="Реликвия">Реликвия</option>
                <option value="Место">Место</option>
                <option value="Орден">Орден</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="card-alignment">Принадлежность</label>
              <select class="field__control" id="card-alignment" name="CardAlignment" data-selected="${CardAlignment}">
                <option value="Добро">Добро</option>
                <option value="Зло">Зло</option>
                <option value="Нейтрал">Нейтрал</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="card-ability">Способность <span class="required-mark">*</span></label>
              <input class="field__control" type="text" id="card-ability" name="CardAbility" value="${CardAbility}" autocomplete="off" required>
            </div>
            <div class="field field--full">
              <span class="field__label" id="description-label">Описание</span>
              <div id="editor"></div>
              <div class="description-meta"><span id="character-counter">Символов: 0 / 500</span></div>
            </div>
            <div class="field field--full">
              <label class="field__label" for="card-image">Изображение карточки</label>
              <!-- Без name: файл читается отдельно; в запрос попадёт строка CardImage. -->
              <input class="field__control file-input" type="file" id="card-image" accept="image/png,image/jpeg" aria-describedby="image-hint">
              <small id="image-hint" class="file-hint">PNG или JPEG, до 3 МиБ. Оставьте поле пустым, чтобы не менять текущую картинку.</small>
              <img id="image-preview" class="image-preview" data-current="${CardImage}" alt="Предпросмотр изображения карточки" hidden>
            </div>
          </div>
          <div id="form-notice" class="notice notice--error" role="alert" hidden></div>
          <div class="form-actions">
            <a class="button button--secondary" href="/admin/cards">Отмена</a>
            <button class="button button--primary" id="save-button" type="submit" disabled>Сохранить</button>
          </div>
          <noscript>Для сохранения карточки включите JavaScript.</noscript>
        </form>
      </section>
    </main>
  </div>

  <textarea id="description-data" hidden>${CardDescription}</textarea>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('card-form');
      const fileInput = document.getElementById('card-image');
      const preview = document.getElementById('image-preview');
      const currentImage = preview.dataset.current || '';
      const notice = document.getElementById('form-notice');
      const saveButton = document.getElementById('save-button');
      const counter = document.getElementById('character-counter');
      const maxBytes = 3 * 1024 * 1024;
      const maxDescriptionLength = 500;
      let objectUrl = '';

      function showError(message) {
        notice.textContent = message;
        notice.hidden = false;
      }

      for (const select of form.querySelectorAll('select[data-selected]')) {
        if (Array.from(select.options).some(option => option.value === select.dataset.selected)) {
          select.value = select.dataset.selected;
        }
      }

      function showImage(file) {
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = file ? URL.createObjectURL(file) : '';
        const src = objectUrl || currentImage;
        if (src) preview.src = src;
        else preview.removeAttribute('src');
        preview.hidden = !src;
      }

      showImage();
      fileInput.addEventListener('change', () => {
        notice.hidden = true;
        const file = fileInput.files[0];
        if (file && (!['image/png', 'image/jpeg'].includes(file.type) || !file.size || file.size > maxBytes)) {
          fileInput.value = '';
          showImage();
          showError('Выберите непустой PNG или JPEG размером не больше 3 МиБ.');
          return;
        }
        showImage(file);
      });

      if (typeof Quill === 'undefined') {
        showError('Редактор описания не загрузился. Обновите страницу перед сохранением.');
        return;
      }

      const quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Введите описание карточки…',
        modules: { toolbar: [
          [{ header: [2, 3, false] }], ['bold', 'italic', 'underline'],
          [{ list: 'ordered' }, { list: 'bullet' }], ['link', 'clean']
        ] }
      });
      quill.root.setAttribute('aria-labelledby', 'description-label');
      const description = document.getElementById('description-data').value;
      if (description) quill.clipboard.dangerouslyPasteHTML(description);

      function updateCounter() {
        const length = quill.getText().trimEnd().length;
        counter.textContent = 'Символов: ' + length + ' / ' + maxDescriptionLength;
        counter.classList.toggle('is-over-limit', length > maxDescriptionLength);
      }
      quill.on('text-change', updateCounter);
      updateCounter();

      function imageToBase64(file) {
        if (!file) return Promise.resolve('');
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reader.onabort = () => reject(new Error('Не удалось прочитать файл.'));
          reader.readAsDataURL(file);
        });
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (saveButton.disabled) return;
        notice.hidden = true;

        if (quill.getText().trimEnd().length > maxDescriptionLength) {
          showError('Описание должно быть не длиннее ' + maxDescriptionLength + ' символов.');
          quill.focus();
          return;
        }

        document.getElementById('description-field').value = quill.root.innerHTML;
        const file = fileInput.files[0];
        const body = new URLSearchParams(new FormData(form));
        const url = body.get('CardId') === '0' ? '/admin/create' : '/admin/update';
        saveButton.disabled = true;
        fileInput.disabled = true;
        saveButton.textContent = 'Сохранение…';
        try {
          if (file) {
            // Проверяем, что браузер может открыть выбранную картинку.
            await preview.decode().catch(() => {
              throw new Error('Файл не удалось открыть как изображение. Выберите другой PNG или JPEG.');
            });
          }
          body.set('CardImage', await imageToBase64(file));
          const response = await fetch(url, { method: 'POST', body });
          if (response.redirected || response.status === 401) {
            throw new Error('Войдите в админ-панель заново.');
          }
          if (!response.ok) {
            const result = await response.json().catch(() => null);
            throw new Error(result?.Message || result?.message || 'HTTP ' + response.status);
          }
          window.location.assign('/admin/cards');
        } catch (error) {
          showError('Ошибка при сохранении: ' + error.message);
          saveButton.disabled = false;
          fileInput.disabled = false;
          saveButton.textContent = 'Сохранить';
        }
      });
      saveButton.disabled = false;
    });
  </script>
</body>
</html>
