<html>

<head>
    <meta name="viewPort" content="width=device-width, initial-scale=1.0">
    
    <style>

        body
        {
            background-color: #ffffff;
            min-height: 100vh;
            color: #212121;
        }

        .appContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        .weatherContainer
        {
            position: absolute;

            top: 35px;
            right: 35px;

            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .temperature
        {
            font-size: 32px;
            font-weight: 700;
            line-height: 100%;

            color: #212121;
        }

        .location
        {
            font-size: 20px;
            font-weight: 700;
            line-height: 100%;

            color: #6e6cdf;
        }

        .centerContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            max-width: 1715.94px;
            height: 100%;
            max-height: 397.68px;

            gap: 55.65px;
        }

        .topContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 9.28px;
        }

        .bottomContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 621.45px;
            height: 185.75px;

            gap: 55.65px;
        }

        .clock
        {
            font-size: 74px;
            font-weight: 700;
            line-height: 100%;

            color: #212121;
        }

        .greetings
        {

            font-size: 36px;
            font-weight: 700;
            line-height: 100%;

            color: #6e6cdf;
        }

        .searchingForm
        {
            display: flex;
            align-items: flex-start;

            width: 621.45px;
            height: 65.1px;

            border-radius: 18.55px;
            border: 1.16px solid #eeeeee;

            padding: 18.55px 27.83px 18.55px 27.83px;
            gap: 9.28px;


            background-color: #fafafa;
        }

        .searhIcon
        {
            width: 28px;
            height: 28px;
        }

        .searchInput
        {
            border: none;
            background: transparent;
            outline: none;

            width: 72px;
            height: 28px;

            font-weight: 400; 
            font-size: 20px; 
            line-height: 140%; 
            letter-spacing: 0.23px;

            color: #9e9e9e; 
        }

        .buttonContainer 
        {
            display: flex;
            align-items: center;

            list-style: none;
            padding: 0;
            margin: 0;

            gap: 27.83px;

            height: 65px;
            width: 621.96px;

            justify-content: space-between;
        }

        .appButton
        {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 65px;
            height: 65px;
            
            border-radius: 18.57px;
            border: 1.16px #eeeeee;

            background-color: #fafafa;
        }

        .appImage
        {
            width: 64px;
            height: 64px;
        }

        @media (max-width: 600px)
        {

        .weatherContainer
        {     
            width:auto ;
            height: auto;

            top: 20px;
            right: 24px;

            justify-content: flex-end;
            align-items: flex-end;
        }

        .temperature
        {
            width: 31px;
            height: 29px;

            font-weight: 700;
            font-size: 22px;
            line-height: 100%;

            color: #212121;
        }

        .location
        {   
            width: 68px;
            height: 19px;

            font-weight: 700;
            font-size: 14px;
            line-height: 100%;

            color: #6e6cdf;
        }

        .centerContainer
        {
            width: auto;
            max-width: 345px;
            height: auto;

            justify-content: space-between;

            gap: 55.65px;
        }

        .topContainer
        {
            position: absolute;
            bottom: 464.5px;

            width: 100%;
            max-width: 345px;
            height: 104px;

            gap: 8px;
        }

        .bottomContainer
        {
            position: absolute;
            bottom: 120px;

            width: 100%;
            max-width: 345px;
            height: 129px;

            gap: 24px;
        }
            
        .clock
        {
            width: 182px;
            height: 64px;

            font-weight: 700;
            font-size: 48px;
            line-height: 100%;

            align-items: center;

            color: #212121;
        }

        .greetings
        {
            width: auto;
            height: 32px;

            font-weight: 700;
            font-size: 24px;
            line-height: 100%;

            color: #6e6cdf;
        }

        .searchingForm
        {
            width: 100%;
            max-width: 345px;
            height: 57px;

            border-radius: 16px;
            border: 1px solid #eeeeee;

            padding: 16px 24px 16px 24px;
            gap: 8px;


            background-color: #fafafa;
        }
        
        .searhIcon
        {
            width: 24px;
            height: 24px;
        }

        .searchInput
        {
            border: none;
            background: transparent;
            outline: none;

            width: 65px;
            height: 25px;

            flex:1;

            font-weight: 400; 
            font-size: 18px; 
            line-height: 140%; 
            letter-spacing: 0.2px;

            color: #9e9e9e; 
        }

        .buttonContainer 
        {
            
            display: flex;
            align-items: center;

            list-style: none;
            padding: 0;
            margin: 0;

            width: 100%;
            max-width: 345px;
            height: 48px;

            gap: 24px;
        }
        .buttonContainer li:nth-child(6)
        {
            display: none;
        }
        .buttonContainer li:nth-child(7)
        {
            display: none;
        }



        .appContainer
        {
            padding: 0;
        }

        .appButton
        {

            width: 48px;
            height: 48px;
            
            border-radius: 16px;
            border: 1px #eeeeee;

            background-color: #fafafa;
        }

        .appImage
        {
            width: 48px;
            height: 48px;
        }

        }

    </style>

</head>    

<body>
    

    <main class="appContainer">

        <header class="weatherContainer">

            <div class="temperature">
                36°
            </div>

            <div class="location">
                Ahmedabad
            </div>

        </header>

        <section class="centerContainer">
            
            <div class="topContainer">
                <div class="clock">
                    09:11:01
                </div>

                <div class="greetings">
                    Good morning, Saad.
                </div>
            </div>

            <div class="bottomContainer">
                <form class="searchingForm">
                    <img src="searchIcons/search-01.svg" alt="" class="searhIcon">
                    <input type="text" placeholder="Search" class="searchInput">
                </form>

                <nav class="appDock">
                    <ul class="buttonContainer">
                        <li> 
                            <a class="appButton" href="https://www.youtube.com">
                                <img class="appImage" src="searchIcons/YouTube.svg" alt="YouTube">
                            </a>
                        </li>

                        <li>
                            <a class="appButton" href="https://chatgpt.com">
                                <img class="appImage" src="searchIcons/ChatGPT.svg" alt="ChatGPT">
                            </a>
                        </li>

                        <li>
                            <a class="appButton" href="https://www.geeksforgeeks.org">
                                <img class="appImage" src="searchIcons/GC.svg" alt="nissan">
                            </a>
                        </li>

                        <li> 
                            <a class="appButton" href="https://chat.deepseek.com">
                                <img class="appImage" src="searchIcons/deepseek.svg" alt="deepseek">
                            </a>
                        </li>

                        <li>
                            <a class="appButton" href="https://github.com">
                                <img class="appImage" src="searchIcons/github.svg" alt="gitHub">
                            </a>
                        </li>

                        <li>
                            <a class="appButton" href="https://www.linkedin.com">
                                <img class="appImage" src="searchIcons/LI.svg" alt="LI">
                            </a>
                        </li>

                        <li>
                            <a class="appButton" href="link">
                                <img class="appImage" src="searchIcons/Plus.svg" alt="plus">
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </section>
            

    </main>
</body>

</html>
